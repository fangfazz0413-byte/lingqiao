name: 测试

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # 灵桥在 Windows 上以 UTF-8 模式运行（启动器会打开），测试也一样
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 跑测试
        # -v 逐个列出测试名；卡住超过 20 分钟就打印每个线程卡在哪一行再退出，不白等
        run: >-
          python -B -X faulthandler -c "import faulthandler, sys, unittest;
          faulthandler.dump_traceback_later(1200, exit=True);
          sys.exit(not unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests', '-v'], exit=False).result.wasSuccessful())"

      - name: Windows：安装并打开灵桥
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -X utf8 app\windows_setup.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $home2 = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Force $home2 | Out-Null
          $env:BRIDGE_HOME = $home2
          $p = Start-Process -FilePath .bridge\runtime\Scripts\python.exe -ArgumentList '-X', 'utf8', 'app\server.py' -PassThru `
                 -RedirectStandardOutput $env:RUNNER_TEMP\out.txt -RedirectStandardError $env:RUNNER_TEMP\err.txt
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $p.HasExited; $i++) {
            Start-Sleep 1
            try { if ((Invoke-RestMethod http://127.0.0.1:8791/api/health).product -eq 'session-bridge') { $ok = $true; break } } catch {}
          }
          Start-Sleep 10
          $alive = -not $p.HasExited
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content $env:RUNNER_TEMP\out.txt, $env:RUNNER_TEMP\err.txt, app\server.log -ErrorAction SilentlyContinue
          Get-ChildItem *.lnk, (Join-Path ([Environment]::GetFolderPath('Desktop')) '*.lnk') -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error '灵桥没起来'; exit 1 }
          if (-not $alive) { Write-Error '灵桥起来后又退出了'; exit 1 }
          Write-Output '灵桥在 Windows 上起来了，窗口开着'
