name: 测试

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: '要发布的版本号（比如 3.6.0，要和 app/server.py 的 VERSION 一致）；留空只测试和打包'
        required: false
        default: ''

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # 灵桥在 Windows 上以 UTF-8 模式运行（启动器会打开），测试也一样
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 跑测试
        # -v 逐个列出测试名；卡住超过 20 分钟就打印每个线程卡在哪一行再退出，不白等
        run: >-
          python -B -X faulthandler -c "import faulthandler, sys, unittest;
          faulthandler.dump_traceback_later(1200, exit=True);
          sys.exit(not unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests', '-v'], exit=False).result.wasSuccessful())"

      - name: Windows：安装，再从快捷方式打开灵桥
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -X utf8 app\windows_setup.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $links = @((Join-Path $pwd '灵桥.lnk'),
                     (Join-Path ([Environment]::GetFolderPath('Desktop')) '灵桥.lnk'),
                     (Join-Path ([Environment]::GetFolderPath('Programs')) '灵桥.lnk'))
          foreach ($l in $links) { if (-not (Test-Path -LiteralPath $l)) { Write-Error "快捷方式没建成：$l"; exit 1 } }
          $home2 = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Force $home2 | Out-Null
          $env:BRIDGE_HOME = $home2
          Start-Process -FilePath $links[0]          # 和双击桌面上的「灵桥」一样
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 1
            try { if ((Invoke-RestMethod http://127.0.0.1:8791/api/health).product -eq 'session-bridge') { $ok = $true; break } } catch {}
          }
          Start-Sleep 10
          $instance = Get-Content .bridge\instance.json -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          $alive = $instance -and (Get-Process -Id $instance.pid -ErrorAction SilentlyContinue)
          Get-Content app\server.log, app\startup-error.log -ErrorAction SilentlyContinue
          if ($alive) { Stop-Process -Id $instance.pid -Force }
          if (-not $ok) { Write-Error '灵桥没起来'; exit 1 }
          if (-not $alive) { Write-Error '灵桥起来后又退出了'; exit 1 }
          Write-Output '从快捷方式打开了灵桥，窗口开着'

  package:
    # 测试都过了才打包：Mac 版、Windows 版各一个下载包，各自只放该系统用得到的文件
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 打 Mac 版、Windows 版两个下载包
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          version=$(sed -n "s/^VERSION = '\(.*\)'$/\1/p" app/server.py)
          echo "灵桥 $version"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::版本标签 ${GITHUB_REF#refs/tags/} 和 app/server.py 里的 VERSION = '$version' 不一致"; exit 1
          fi
          if [[ -n "$RELEASE" && "$RELEASE" != "$version" ]]; then
            echo "::error::要发布的 $RELEASE 和 app/server.py 里的 VERSION = '$version' 不一致"; exit 1
          fi
          mkdir dist
          git archive --format=zip --prefix=lingqiao/ -o dist/lingqiao-mac.zip HEAD -- . ':(exclude).github' \
            ':(exclude)install.bat' ':(exclude)app/windows_setup.py' ':(exclude)app/requirements-windows.txt' \
            ':(exclude)app/wincred.py' ':(exclude)app/lingqiao.ico'
          git archive --format=zip --prefix=lingqiao/ -o dist/lingqiao-windows.zip HEAD -- . ':(exclude).github' \
            ':(exclude)会话桥.app' ':(exclude)install.sh' ':(exclude)app/repair-runtime.sh' ':(exclude)app/requirements-desktop.txt'
          python3 - <<'CHECK'
          import zipfile
          mac, win = (zipfile.ZipFile(f'dist/lingqiao-{n}.zip') for n in ('mac', 'windows'))
          for z in (mac, win):
              print('==', z.filename)
              print('\n'.join(sorted(i.filename for i in z.infolist() if not i.is_dir())))
              assert all(i.flag_bits & 0x800 for i in z.infolist() if not i.filename.isascii()), '中文文件名要标 UTF-8'
          mac_names, win_names = set(mac.namelist()), set(win.namelist())
          # Mac 包里要有启动器、没有 Windows 的文件；Windows 包反过来；install.bat 要是 CRLF 换行
          assert 'lingqiao/会话桥.app/Contents/MacOS/会话桥' in mac_names and 'lingqiao/install.sh' in mac_names
          assert not any('install.bat' in n or 'windows_setup' in n for n in mac_names)
          assert 'lingqiao/install.bat' in win_names and 'lingqiao/app/windows_setup.py' in win_names
          assert not any('会话桥.app' in n or n.endswith('install.sh') for n in win_names)
          assert win.read('lingqiao/install.bat').count(b'\r\n') > 5, 'install.bat 要是 CRLF'
          print('两个包都检查过了')
          CHECK
      - uses: actions/upload-artifact@v4
        with:
          name: lingqiao-packages
          path: dist/*.zip

  release:
    # 推送 v 开头的版本标签（比如 v3.6.0），或者手动运行时填了版本号：把两个包发到 GitHub 的 Releases 页
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lingqiao-packages
          path: dist
      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [[ -n "$RELEASE" ]]; then tag="v$RELEASE"; else tag="${GITHUB_REF#refs/tags/}"; fi
          # 标签不存在时 gh 会在这次测试过的提交上建
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "灵桥 ${tag#v}" --notes-file - \
            "dist/lingqiao-mac.zip#灵桥 Mac 版（Apple 芯片）" "dist/lingqiao-windows.zip#灵桥 Windows 版（Windows 10 / 11）" <<'NOTES'
          ## 下载哪个

          - **Mac**（Apple 芯片）：下载 `lingqiao-mac.zip`，解压后在终端里进入 `lingqiao` 文件夹运行 `bash install.sh`，装好后双击 `会话桥.app`。
          - **Windows**（10 / 11）：下载 `lingqiao-windows.zip`，解压后双击 `install.bat`，装好后双击桌面上的「灵桥」。

          下载包装的不能用「检查更新」，新版本出来后重新下载。想一键更新，按 README 用 `git clone` 安装。
          NOTES
